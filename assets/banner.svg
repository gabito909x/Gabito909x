<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">GABO — Gabriel Sánchez, Técnico en Programación de Software</title>
  <desc id="bannerDesc">Banner pixel art con fondo oscuro, bloques difuminados en cian y azul, el nombre GABO con contornos apilados y una línea de terminal con cursor parpadeante.</desc>

  <defs>
    <filter id="bgBlur" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="18" result="dilated"/>
      <feFlood flood-color="#02040A" result="color"/>
      <feComposite in="color" in2="dilated" operator="in"/>
    </filter>

    <filter id="outlineIce" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="10" result="dilated"/>
      <feFlood flood-color="#E8F9FF" result="color"/>
      <feComposite in="color" in2="dilated" operator="in"/>
    </filter>

    <filter id="outlineCyan" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="dilated"/>
      <feFlood flood-color="#5EEAFF" result="color"/>
      <feComposite in="color" in2="dilated" operator="in"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#5EEAFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <radialGradient id="vignette" cx="50%" cy="42%" r="78%">
      <stop offset="0" stop-color="#05070F" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#05070F" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#05070F" stop-opacity="0.88"/>
    </radialGradient>

    <mask id="counterMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="600">
      <rect width="1200" height="600" fill="#FFFFFF"/>
      <!-- Contraforma de la A -->
      <rect x="488" y="152" width="32" height="64" fill="#000000"/>
      <!-- Contraformas de la B -->
      <rect x="680" y="152" width="32" height="64" fill="#000000"/>
      <rect x="680" y="248" width="32" height="64" fill="#000000"/>
      <!-- Contraforma de la O -->
      <rect x="872" y="152" width="32" height="160" fill="#000000"/>
    </mask>

